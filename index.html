<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sheber Mini App</title>
    <!-- Подключаем SDK Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #272727;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --accent: #facc15;
            --accent-dark: #eab308;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 80px;
        }

        .container {
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 5px 0;
            font-weight: 700;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0;
        }

        .search-bar {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            margin-bottom: 24px;
        }

        .search-bar input {
            background: transparent;
            border: none;
            color: white;
            font-size: 15px;
            width: 100%;
            outline: none;
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }

        .card:active {
            transform: scale(0.96);
            background-color: #333;
        }

        .icon-circle {
            width: 48px;
            height: 48px;
            background-color: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 12px;
        }

        .card h3 {
            margin: 0 0 4px 0;
            font-size: 15px;
            font-weight: 600;
        }

        .card p {
            margin: 0;
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.3;
        }

        /* Нижняя навигация */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #1a1a1a;
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-around;
            padding: 10px 0 20px 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 11px;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent);
        }

        .nav-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 4px;
        }

        .nav-item.active .nav-icon {
            background-color: var(--accent);
            color: #000;
        }

        .whatsapp-btn {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background-color: #25D366;
            color: white;
            border: none;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
            cursor: pointer;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h1>Что починить?</h1>
                <p class="subtitle">Выберите категорию — мастера увидят ваш заказ</p>
            </div>
        </header>

        <div class="search-bar">
            <span style="margin-right: 10px; color: var(--text-muted);">🔍</span>
            <input type="text" placeholder="Поиск... сантехник, электрик">
        </div>

        <div class="grid">
            <div class="card" onclick="createOrder('Сантехник')">
                <div class="icon-circle">🔧</div>
                <h3>Сантехник</h3>
                <p>Краны, трубы, засоры</p>
            </div>
            
            <div class="card" onclick="createOrder('Электрик')">
                <div class="icon-circle">💡</div>
                <h3>Электрик</h3>
                <p>Проводка, свет, розетки</p>
            </div>
            
            <div class="card" onclick="createOrder('Мастер на час')">
                <div class="icon-circle">🛠️</div>
                <h3>Мастер на час</h3>
                <p>Мелкий ремонт</p>
            </div>
            
            <div class="card" onclick="createOrder('Авто')">
                <div class="icon-circle">🚗</div>
                <h3>Авто</h3>
                <p>Автоэлектрик, помощь</p>
            </div>
            
            <div class="card" onclick="createOrder('Замки')">
                <div class="icon-circle">🔑</div>
                <h3>Замки</h3>
                <p>Вскрытие, замена</p>
            </div>
            
            <div class="card" onclick="createOrder('Техника')">
                <div class="icon-circle">📺</div>
                <h3>Техника</h3>
                <p>Стиралки, холодильники</p>
            </div>
        </div>
    </div>

    <!-- Кнопка WhatsApp -->
    <button class="whatsapp-btn" onclick="contactWhatsApp()">💬</button>

    <!-- Нижнее меню -->
    <div class="bottom-nav">
        <div class="nav-item active">
            <div class="nav-icon">🔍</div>
            <span>Ищу</span>
        </div>
        <div class="nav-item">
            <div class="nav-icon">🔧</div>
            <span>Мастер</span>
        </div>
        <div class="nav-item">
            <div class="nav-icon">❓</div>
            <span>Поддержка</span>
        </div>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем приложение на весь экран

        // Получаем данные пользователя из Telegram
        const user = tg.initDataUnsafe?.user || { id: 'test_user', first_name: 'Гость' };
        console.log("Пользователь Telegram:", user);

        // Функция создания заказа
        function createOrder(category) {
            // Визуальный отклик
            tg.HapticFeedback.impactOccurred('medium');
            
            // Формируем данные
            const orderData = {
                user_id: user.id,
                name: user.first_name,
                category: category,
                status: "searching",
                timestamp: new Date().toISOString()
            };

            // Здесь в будущем будет запрос к вашему серверу (API)
            // fetch('https://ваш-сервер.com/api/order', { method: 'POST', body: JSON.stringify(orderData) })
            
            console.log("Отправка заказа на сервер:", orderData);

            // Показываем нативное уведомление Telegram
            tg.showAlert(`✅ Заказ на "${category}" создан!\nИщем свободного мастера...`);
            
            // Если хотите закрыть приложение после заказа, раскомментируйте:
            // setTimeout(() => tg.close(), 2000);
        }

        // Функция связи в WhatsApp
        function contactWhatsApp() {
            const phone = "77011234567"; // ЗАМЕНИТЕ НА ВАШ НОМЕР
            const text = encodeURIComponent("Здравствуйте! Нужна помощь мастера через Sheber.");
            
            // Открываем ссылку внутри Telegram
            tg.openLink(`https://wa.me/${phone}?text=${text}`);
        }
    </script>
</body>
</html>
